<!DOCTYPE html>
<html>
<head>
  <title>WebFlix Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<!-- Register Form -->
<div class="container my-5" style="max-width: 400px;">
  <div class="card">
    <div class="card-header bg-success text-white">Register</div>
    <div class="card-body">
      <form id="registerForm" method="post">
        <div class="mb-3">
          <label>Name</label>
          <input type="text" class="form-control" id="registerName" name="u_username" required>
        </div>
        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" id="registerEmail" name="u_email" required>
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" class="form-control" id="registerPassword" name="u_norm_password" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Register</button>
      </form>
      <p class="mt-3 text-center">
        Already have an account? <a href="login.html">Login here</a>
      </p>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white mt-5 p-4 text-center">
  <div class="container">
    <p>&copy; 2025 WebFlix. All rights reserved.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
