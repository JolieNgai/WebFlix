<!DOCTYPE html>
<html>
<head>
  <title>WebFlix Catalog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<!-- Main content -->
<div class="container my-4">
  <h1 class="mb-4">Movie Catalog</h1>

  <div class="mb-3">
    <input type="text" id="search" class="form-control" placeholder="Search movies.">
    <button id="searchBtn" onclick="searchMovies()" class="btn btn-primary mt-2">Search</button>
  </div>

  <div id="movies" class="row"></div>

  <!-- NEW: Pagination controls -->
  <div id="pagination" class="mt-3 d-flex justify-content-center"></div>
</div>

<!-- Footer -->
<div id="footer-placeholder"></div>

<!-- Scripts LAST -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/movies.js"></script>
</body>
</html>
