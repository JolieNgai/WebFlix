<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<main class="container my-5">

    <span class="eyebrow">YOUR CORNER OF CINEMA</span>
    <h1 class="mb-4">Your collection.<br>Your next great watch.</h1>

    <!-- PROFILE INFO -->
    <div id="profile-info" class="mb-5 p-3 border rounded bg-light">
        <p><strong>Name:</strong> <span id="profile-name">Loading...</span></p>
        <p><strong>Email:</strong> <span id="profile-email">Loading...</span></p>
    </div>

    <!-- WATCHLIST -->
    <h2>Your Watchlist</h2>
    <div id="watchlist" class="row mt-3"></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/profile.js"></script>
<script src="js/main.js"></script>

<!-- Footer -->
<div id="footer-placeholder"></div>

</body>
</html>
