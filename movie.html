<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie profile | WebFlix</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar-placeholder"></div>
<main class="movie-page">
<div id="movieDetail" aria-live="polite"></div>
<section id="related-section" class="related-section" aria-labelledby="related-heading"><h2 id="related-heading">Related movies</h2><div id="related-movies" class="related-grid"><p>Choose a movie to discover more from the collection.</p></div></section>
<section class="reviews-section" id="reviews">
<div><span class="section-kicker">JOIN THE CONVERSATION</span><h2>Leave a review</h2><form id="reviewForm"><input type="hidden" id="movieIdInput"><div class="mb-3"><label for="rating" class="form-label">Your rating</label><select id="rating" class="form-select" required><option value="">Select a rating</option><option value="1">1 - Very bad</option><option value="2">2 - Bad</option><option value="3">3 - Okay</option><option value="4">4 - Good</option><option value="5">5 - Great</option></select></div><div class="mb-3"><label for="comment" class="form-label">Your perspective</label><textarea id="comment" class="form-control" rows="4" placeholder="What stayed with you?" required></textarea></div><button type="submit" class="btn btn-primary">Publish review &rarr;</button></form></div>
<div><span class="section-kicker">FROM THE COMMUNITY</span><h2>Audience reviews</h2><ul id="reviews-list" aria-live="polite"></ul></div>
</section>
</main>
<div id="footer-placeholder"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/movies.js"></script>
</body>
</html>
