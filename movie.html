<!DOCTYPE html>
<html>
<head>
  <title>Movie Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

 <div class="container my-4">
  <div id="movieDetail"></div>

  <!-- Review form -->
  <form id="reviewForm" class="mt-4">
    <h3>Leave a review</h3>
    <input type="hidden" id="movieIdInput">

    <div class="mb-3">
      <label for="rating" class="form-label">Rating (1–5)</label>
      <select id="rating" class="form-select" required>
        <option value="">Select…</option>
        <option value="1">1 - Very bad</option>
        <option value="2">2 - Bad</option>
        <option value="3">3 - Okay</option>
        <option value="4">4 - Good</option>
        <option value="5">5 - Great</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="comment" class="form-label">Comment</label>
      <textarea id="comment" class="form-control" rows="3" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary">Submit review</button>
  </form>

  <!-- NEW: where reviews will appear -->
  <hr class="my-4" />
  <h3>Reviews</h3>
  <ul id="reviews-list" class="mt-3"></ul>


  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts LAST -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/movies.js"></script>
</body>
</html>
